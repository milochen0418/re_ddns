[project]
name = "re-ddns"
version = "0.1.0"
description = "Dynamic DNS Client Interface for BIND9"
requires-python = "~=3.11"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "~3.11"
reflex = "0.8.24.post1"
fastapi = "*"
dnspython = "*"
httpx = "*"
# Reflex 0.8 imports sqlalchemy.ext.asyncio, which needs greenlet; SQLAlchemy 2.1
# moved greenlet into the optional [asyncio] extra, so stay on 2.0.x.
sqlalchemy = "<2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
